<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir senha · Visitor Tracker</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

<main class="login-container">
    <div class="login-card">

        <div class="login-logo">📊 Visitor Tracker</div>

        <form id="resetForm" class="tab-content active">
            <h2 style="font-size:16px;font-weight:600;text-align:center;color:var(--text)">Redefinir senha</h2>

            <label>
                Nova senha <span class="hint">(mínimo 8 caracteres)</span>
                <input type="password" id="newPassword" autocomplete="new-password" required>
            </label>

            <label>
                Confirmar senha
                <input type="password" id="confirmPassword" autocomplete="new-password" required>
            </label>

            <div id="resetError" class="form-error hidden"></div>
            <div id="resetSuccess" class="form-success hidden"></div>

            <button type="submit" id="resetSubmit">Redefinir senha</button>
        </form>

    </div>
</main>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

// Pega o token do hash da URL (Supabase envia assim)
const hash   = window.location.hash.substring(1);
const params = new URLSearchParams(hash);
const accessToken  = params.get("access_token");
const type         = params.get("type");

function showError(msg) {
    const el = document.getElementById("resetError");
    el.textContent = msg;
    el.classList.remove("hidden");
}

function showSuccess(msg) {
    const el = document.getElementById("resetSuccess");
    el.textContent = msg;
    el.classList.remove("hidden");
}

if (!accessToken || type !== "recovery") {
    showError("Link inválido ou expirado. Solicite um novo link de recuperação.");
    document.getElementById("resetSubmit").disabled = true;
}

document.getElementById("resetForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    document.getElementById("resetError").classList.add("hidden");

    const newPassword     = document.getElementById("newPassword").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    if (newPassword.length < 8) {
        showError("A senha deve ter pelo menos 8 caracteres.");
        return;
    }

    if (newPassword !== confirmPassword) {
        showError("As senhas não coincidem.");
        return;
    }

    const btn = document.getElementById("resetSubmit");
    btn.disabled = true;
    btn.textContent = "Aguarde...";

    try {
        const supabase = createClient(
            "https://grswywegekzkbganhlup.supabase.co",
            "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdyc3d5d2VnZWt6a2JnYW5obHVwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ0NTE5NjYsImV4cCI6MjEwMDAyNzk2Nn0.UxfP5xCpFL8SCifpQCiCNnn4F8AE4eBJKL0idq86Exs"
        );

        // Define a sessão com o token de recovery
        await supabase.auth.setSession({
            access_token:  accessToken,
            refresh_token: params.get("refresh_token") || ""
        });

        const { error } = await supabase.auth.updateUser({ password: newPassword });

        if (error) {
            showError(error.message || "Erro ao redefinir senha.");
            btn.disabled = false;
            btn.textContent = "Redefinir senha";
            return;
        }

        showSuccess("Senha redefinida com sucesso! Redirecionando para o login...");
        setTimeout(() => { window.location.href = "/login.html"; }, 2500);

    } catch (err) {
        showError("Erro de conexão. Tente novamente.");
        btn.disabled = false;
        btn.textContent = "Redefinir senha";
    }
});
</script>

</body>
</html>
